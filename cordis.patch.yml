# Windows workspace-open fix.
#
# Why this bundle exists: the shipped `explorer` catalog entry launches through
# `shell-open`, which on Windows ends at `@deepseek-ai/dsh-native-command`
# running `explorer.exe "<file:// URI>"` (0.1.7-rc.1; earlier releases used a
# powershell `Invoke-Item` command, same symptom). That open reports SUCCESS
# while raising nothing on some Windows hosts — the package's own README
# records it: in a non-interactive session `explorer.exe` invokes no file
# association yet still exits 1 after about a second, so "an open reports
# success having opened nothing". The host reads the exit code as the verdict
# (`runExplorer` swallows exit 1 as a delegated handoff and `runShellOpen`
# backs it with a `launchWatchMs` watchdog), so a window that never appeared
# looks exactly like one that did.
#
# `explorer.exe /e,<dir>` raises a window for that directory (measured: 6/6
# fresh windows, and again for the already-open case).
#
# `open-in-app` (the host half) STAYS MOUNTED: this bundle reuses its
# `/open-in-app/apps` and `/open-in-app/open` routes for every non-Explorer
# entry in the menu, so VS Code / Windows Terminal / Git Bash keep the shipped
# resolution and launch path unchanged.
#
# `ui-open-in-app` (the browser half) is disabled so this bundle's client half
# is the only registrant of the Session-header cell. Both halves would
# otherwise claim the shared `open-in-app` cell id, and which one won would
# depend on activation order.

- id: ui-open-in-app
  disabled: true

- insert:
    - id: open-folder-fix
      name: '@local/dsh-open-folder-fix'
      config:
        # Early-failure watch window for the explorer.exe handoff. Launch
        # success is decoupled from process exit because Explorer exits
        # immediately after delegating to the running shell.
        launchWatchMs: 1500
